<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Netflix anime top 10 side project preview</title>
  <desc id="desc">A dark Netflix-inspired anime top 10 dashboard preview with ranking cards and language switch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0b0d"/>
      <stop offset="0.42" stop-color="#141414"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="20%" cy="12%" r="70%">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.55"/>
      <stop offset="0.48" stop-color="#e50914" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="posterA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c667"/>
      <stop offset="0.46" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="posterB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="posterC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.45" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#redGlow)"/>

  <g transform="translate(76 60)">
    <rect x="0" y="0" width="1048" height="72" rx="18" fill="#151515" opacity="0.92"/>
    <text x="28" y="47" fill="#e50914" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900">N</text>
    <rect x="78" y="20" width="1" height="32" fill="#ffffff" opacity="0.24"/>
    <text x="102" y="45" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">ANIME</text>
    <text x="220" y="45" fill="#e50914" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900">TOP 10</text>

    <rect x="789" y="18" width="92" height="36" rx="18" fill="#ffffff"/>
    <text x="809" y="42" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">中文</text>
    <rect x="888" y="18" width="58" height="36" rx="18" fill="#242424"/>
    <text x="908" y="42" fill="#d4d4d8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">EN</text>
    <rect x="960" y="18" width="64" height="36" rx="18" fill="#18181b" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="976" y="42" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">4d</text>
  </g>

  <g transform="translate(82 184)">
    <text x="0" y="0" fill="#e50914" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" letter-spacing="5">TAIWAN WEEKLY RANKING</text>
    <text x="0" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900">Anime Top 10</text>
    <text x="0" y="125" fill="#d4d4d8" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Chinese-first ranking page with English toggle</text>
  </g>

  <g transform="translate(82 375)" filter="url(#shadow)">
    <g>
      <rect width="290" height="260" rx="16" fill="url(#posterA)"/>
      <text x="22" y="96" fill="#ffffff" opacity="0.18" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="900">1</text>
      <rect x="20" y="174" width="250" height="66" rx="12" fill="#000000" opacity="0.68"/>
      <text x="34" y="204" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900">#1 Kaiju No. 8</text>
      <text x="34" y="226" fill="#d4d4d8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Action / Sci-Fi</text>
    </g>

    <g transform="translate(330 0)">
      <rect width="220" height="260" rx="16" fill="url(#posterB)"/>
      <text x="16" y="88" fill="#ffffff" opacity="0.17" font-family="Arial, Helvetica, sans-serif" font-size="105" font-weight="900">2</text>
      <rect x="18" y="181" width="184" height="58" rx="12" fill="#000000" opacity="0.68"/>
      <text x="30" y="211" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900">Demon Slayer</text>
      <text x="30" y="230" fill="#d4d4d8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Fantasy / Action</text>
    </g>

    <g transform="translate(590 0)">
      <rect width="220" height="260" rx="16" fill="url(#posterC)"/>
      <text x="16" y="88" fill="#ffffff" opacity="0.17" font-family="Arial, Helvetica, sans-serif" font-size="105" font-weight="900">3</text>
      <rect x="18" y="181" width="184" height="58" rx="12" fill="#000000" opacity="0.68"/>
      <text x="30" y="211" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900">SPY x FAMILY</text>
      <text x="30" y="230" fill="#d4d4d8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Comedy / Family</text>
    </g>

    <g transform="translate(850 0)">
      <rect width="160" height="260" rx="16" fill="#27272a"/>
      <text x="16" y="88" fill="#ffffff" opacity="0.16" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="900">10</text>
      <rect x="18" y="181" width="124" height="58" rx="12" fill="#000000" opacity="0.68"/>
      <text x="30" y="211" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900">One Piece</text>
      <text x="30" y="230" fill="#d4d4d8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Adventure</text>
    </g>
  </g>
</svg>
